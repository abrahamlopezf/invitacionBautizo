        function normalizeName(str) {
            if (!str) return "";
            return str
                .toUpperCase()
                .trim()
                .replace(/[ÁÀÄ]/g, "A")
                .replace(/[ÉÈË]/g, "E")
                .replace(/[ÍÌÏ]/g, "I")
                .replace(/[ÓÒÖ]/g, "O")
                .replace(/[ÚÙÜ]/g, "U")
                .replace(/\s+/g, " ");
        }

        async function uploadData() {
            const logDiv = document.getElementById('log');
            const statusDiv = document.getElementById('status');
            statusDiv.innerText = "Sincronizando " + guests.length + " invitados con Firebase de forma segura...";

            try {
                // 1. Obtener la lista actual de Firebase
                const snapshot = await db.collection('invitados').get();
                const dbGuests = {};
                snapshot.forEach(doc => {
                    dbGuests[doc.data().nombre] = { id: doc.id, ...doc.data() };
                });

                // 2. Crear un mapa con la nueva lista
                const newGuestsMap = {};
                guests.forEach(g => {
                    newGuestsMap[normalizeName(g.name)] = g.qty;
                });

                // 3. Procesar eliminaciones (están en DB pero no en la nueva lista)
                for (const dbName in dbGuests) {
                    if (!(dbName in newGuestsMap)) {
                        const docId = dbGuests[dbName].id;
                        await db.collection('invitados').doc(docId).delete();
                        logDiv.innerText += `🗑️ Eliminado: ${dbName} (Ya no está en la lista)\n`;
                    }
                }

                // 4. Procesar agregados y actualizaciones
                for (const newName in newGuestsMap) {
                    const newQty = newGuestsMap[newName];
                    const existingGuest = dbGuests[newName];
                    
                    if (existingGuest) {
                        // Ya existe, actualizar si la cantidad cambió (sin borrar su confirmación)
                        if (existingGuest.cantidad_considerada !== newQty) {
                            await db.collection('invitados').doc(existingGuest.id).update({
                                cantidad_considerada: newQty
                            });
                            logDiv.innerText += `🔄 Actualizado: ${newName} (Nuevos pases: ${newQty})\n`;
                        } else {
                            logDiv.innerText += `✅ Intacto: ${newName} (Sin cambios)\n`;
                        }
                    } else {
                        // Es nuevo, agregarlo
                        await db.collection('invitados').add({
                            nombre: newName,
                            cantidad_considerada: newQty
                        });
                        logDiv.innerText += `✨ Agregado: ${newName} (Pases: ${newQty})\n`;
                    }
                }

                statusDiv.innerText = "¡Sincronización terminada exitosamente! Ya puedes cerrar esta ventana.";
                statusDiv.style.color = "green";
            } catch (e) {
                statusDiv.innerText = "Ocurrió un error. Revisa la consola.";
                statusDiv.style.color = "red";
                console.error(e);
                logDiv.innerText += `\nERROR CRÍTICO: ${e.message}\n`;
            }
        }

        window.onload = uploadData;
